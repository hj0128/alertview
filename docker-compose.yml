services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alertview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertview}
      POSTGRES_DB: ${POSTGRES_DB:-alertview}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DBeaver 등 같은 PC 의 GUI 로만 접속 가능하도록 127.0.0.1(로컬 전용)에 바인딩.
    # 인터넷/LAN 에는 노출되지 않음. (다른 기기에서 접속해야 하면 127.0.0.1 부분을 제거)
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alertview} -d ${POSTGRES_DB:-alertview}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 앱 컨테이너 → db 서비스로 연결. .env 의 값보다 우선.
      DATABASE_URL: postgresql://${POSTGRES_USER:-alertview}:${POSTGRES_PASSWORD:-alertview}@db:5432/${POSTGRES_DB:-alertview}
      # 컨테이너 내부 포트는 8000 고정(아래 ports 매핑과 일치).
      WEB_PORT: "8000"
      # 앱 로컬시각=한국시간(KST). 방해금지(QUIET)·마감일 계산·타임스탬프가 KST 기준이 됨.
      # (미설정 시 UTC 라 방해금지 23~8 이 실제론 KST 08~17 로 밀렸었음)
      TZ: Asia/Seoul
    ports:
      - "${HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
